# Déploiement complet (base de PRODUCTION) : PostgreSQL, stockage S3 privé, migrations, API, frontend, proxy.
# PostgreSQL et le stockage ne publient AUCUN port : seuls 80/443 (Caddy) sont exposés.
#
#   docker compose -f docker/compose.yml --env-file .env up -d --build
#
# Pour un essai local avec boîte e-mail de test, ajouter docker/compose.local.yml (voir README).
name: empgt-freelance

x-api-env: &api-env
  NODE_ENV: production
  APP_ENV: ${APP_ENV:-production}
  APP_ORIGIN: ${APP_ORIGIN:?APP_ORIGIN est obligatoire}
  API_PORT: "4000"
  DATABASE_URL: postgresql://${POSTGRES_USER:-empgt}:${POSTGRES_PASSWORD:?POSTGRES_PASSWORD est obligatoire}@postgres:5432/${POSTGRES_DB:-empgt_freelance}
  APP_SECRET: ${APP_SECRET:?APP_SECRET est obligatoire}
  COOKIE_SECURE: ${COOKIE_SECURE:-true}
  SESSION_TTL_HOURS: ${SESSION_TTL_HOURS:-168}
  SESSION_IDLE_HOURS: ${SESSION_IDLE_HOURS:-24}
  TRUST_PROXY: "1"
  OPENAPI_ENABLED: ${OPENAPI_ENABLED:-false}
  LOG_LEVEL: ${LOG_LEVEL:-log}
  STORAGE_DRIVER: s3
  S3_ENDPOINT: http://storage:8333
  S3_REGION: ${S3_REGION:-us-east-1}
  S3_BUCKET: ${S3_BUCKET:-empgt-documents}
  S3_ACCESS_KEY_ID: ${S3_ACCESS_KEY_ID:?S3_ACCESS_KEY_ID est obligatoire}
  S3_SECRET_ACCESS_KEY: ${S3_SECRET_ACCESS_KEY:?S3_SECRET_ACCESS_KEY est obligatoire}
  S3_FORCE_PATH_STYLE: "true"
  UPLOAD_MAX_MB: ${UPLOAD_MAX_MB:-10}
  MAIL_TRANSPORT: ${MAIL_TRANSPORT:-smtp}
  SMTP_HOST: ${SMTP_HOST:-}
  SMTP_PORT: ${SMTP_PORT:-587}
  SMTP_SECURE: ${SMTP_SECURE:-false}
  SMTP_USER: ${SMTP_USER:-}
  SMTP_PASSWORD: ${SMTP_PASSWORD:-}
  MAIL_FROM: ${MAIL_FROM:-Plateforme Freelance E-MPGT <no-reply@localhost>}
  ADMIN_ALERT_EMAILS: ${ADMIN_ALERT_EMAILS:-}
  IMPORT_ALLOWED_HOSTS: ${IMPORT_ALLOWED_HOSTS:-e-mpgt.com}
  PAYMENT_PROVIDER: ${PAYMENT_PROVIDER:-}
  PAYMENT_WEBHOOK_SECRET: ${PAYMENT_WEBHOOK_SECRET:-}

services:
  postgres:
    image: postgres:18.6-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-empgt_freelance}
      POSTGRES_USER: ${POSTGRES_USER:-empgt}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD est obligatoire}
    volumes:
      - pgdata:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 20
    networks: [backend]

  storage:
    image: chrislusf/seaweedfs:4.48
    restart: unless-stopped
    entrypoint: ["/bin/sh", "/opt/empgt/start.sh"]
    environment:
      S3_ACCESS_KEY_ID: ${S3_ACCESS_KEY_ID:?S3_ACCESS_KEY_ID est obligatoire}
      S3_SECRET_ACCESS_KEY: ${S3_SECRET_ACCESS_KEY:?S3_SECRET_ACCESS_KEY est obligatoire}
      S3_BUCKET: ${S3_BUCKET:-empgt-documents}
    volumes:
      - ./seaweedfs/start.sh:/opt/empgt/start.sh:ro
      - storagedata:/data
    healthcheck:
      test: ["CMD-SHELL", "wget -q -S -O /dev/null http://127.0.0.1:8333/ 2>&1 | grep -q 'HTTP/'"]
      interval: 5s
      timeout: 5s
      retries: 30
    networks: [backend]

  # Migrations versionnées appliquées avant chaque démarrage de l'API (service ponctuel).
  migrate:
    build:
      context: ..
      dockerfile: docker/Dockerfile
      target: api
    image: empgt-freelance-api:latest
    command: ["node", "node_modules/prisma/build/index.js", "migrate", "deploy"]
    environment: *api-env
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"
    networks: [backend]

  api:
    image: empgt-freelance-api:latest
    restart: unless-stopped
    environment: *api-env
    depends_on:
      migrate:
        condition: service_completed_successfully
      storage:
        condition: service_healthy
    networks: [backend, frontend]

  web:
    build:
      context: ..
      dockerfile: docker/Dockerfile
      target: web
      args:
        API_INTERNAL_URL: http://api:4000
    image: empgt-freelance-web:latest
    restart: unless-stopped
    environment:
      API_INTERNAL_URL: http://api:4000
    depends_on:
      api:
        condition: service_healthy
    networks: [frontend]

  caddy:
    image: caddy:2.11.7-alpine
    restart: unless-stopped
    environment:
      SITE_ADDRESS: ${SITE_ADDRESS:-:80}
    ports:
      - "${HTTP_PORT:-80}:80"
      - "${HTTPS_PORT:-443}:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddydata:/data
      - caddyconfig:/config
    depends_on:
      web:
        condition: service_healthy
    networks: [frontend]

volumes:
  pgdata:
  storagedata:
  caddydata:
  caddyconfig:

networks:
  # Réseau interne : base et stockage ne sont joignables que par l'API.
  backend:
    internal: true
  frontend:
